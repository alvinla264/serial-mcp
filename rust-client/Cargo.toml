[package]
name = "serial-mcp-rust-client"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"

[[bin]]
name = "serial-mcp-rust-client"
path = "src/main.rs"

[[bin]]
name = "serial-mcp-terminal"
path = "src/terminal.rs"

[dependencies]
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "=1.54.1", features = ["macros", "rt", "io-std"] }
serde_json = "=1.0.149"
libc = "=0.2.183"
crossterm = "=0.29.0"
ratatui = "=0.30.0"
vt100 = "=0.16.2"
base64 = "=0.22.1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
