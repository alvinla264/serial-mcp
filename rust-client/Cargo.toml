[package]
name = "serial-mcp-rust-client"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"

[[bin]]
name = "serial-mcp-rust-client"
path = "src/main.rs"

[dependencies]
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "=1.54.1", features = ["macros", "rt", "io-std"] }
serde = { version = "=1.0.228", features = ["derive"] }
schemars = "=1.2.3"
serde_json = "=1.0.149"
libc = "=0.2.183"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
