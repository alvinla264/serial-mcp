[project]
name = "serial-mcp"
version = "0.2.0"
description = "Generic serial transport MCP server with a shareable tio-style session"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "pyserial>=3.5",
]

[project.scripts]
serial-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Single-module package: ship server.py at the wheel root so the
# serial-mcp = "server:main" entry point resolves.
include = ["server.py"]
