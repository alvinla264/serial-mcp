[project]
name = "serial-mcp"
version = "0.2.0"
description = "Generic serial transport MCP server with a shareable tio-style session"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "pyserial>=3.5",
]

[project.scripts]
serial-mcp = "server:main"
serial-mcp-daemon = "serial_mcp_daemon:main"
serial-mcp-terminal = "serial_mcp_terminal:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Top-level modules at the wheel root so the console entry points resolve:
# server (legacy MCP server), serial_mcp_ipc (stdlib-only IPC/client helpers),
# serial_mcp_daemon (shared daemon) and serial_mcp_terminal (human terminal).
# See docs/daemon-ipc.md.
include = ["server.py", "serial_mcp_ipc.py", "serial_mcp_daemon.py", "serial_mcp_terminal.py"]
