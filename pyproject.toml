[project]
name = "serial-mcp"
version = "0.2.0"
description = "Generic serial transport MCP server with a shareable tio-style session"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "pyserial>=3.5",
]

[project.scripts]
# serial-mcp is the thin stdio MCP frontend of the shared daemon (docs/mcp-frontend.md).
# serial-mcp-legacy keeps the previous in-process server (one device per MCP process).
serial-mcp = "serial_mcp_client:main"
serial-mcp-legacy = "server:main"
serial-mcp-daemon = "serial_mcp_daemon:main"
serial-mcp-terminal = "serial_mcp_terminal:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Top-level modules at the wheel root so the console entry points resolve:
# server (legacy MCP server), serial_mcp_client (stdio MCP frontend),
# serial_mcp_ipc (stdlib-only IPC/client helpers), serial_mcp_daemon (shared
# daemon) and serial_mcp_terminal (human terminal). See docs/daemon-ipc.md,
# docs/mcp-frontend.md and docs/human-terminal.md.
include = ["server.py", "serial_mcp_client.py", "serial_mcp_ipc.py", "serial_mcp_daemon.py", "serial_mcp_terminal.py"]
