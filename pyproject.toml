[project]
name = "serial-mcp"
version = "0.3.0"
description = "Generic serial transport MCP server with a shareable tio-style session"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "pyserial>=3.5",
]

[project.scripts]
# serial-mcp is installed as a native executable by the PEP 517 build backend.
# serial-mcp-legacy keeps the previous in-process server (one device per MCP process).
serial-mcp-legacy = "server:main"
serial-mcp-daemon = "serial_mcp_daemon:main"
serial-mcp-terminal = "serial_mcp_terminal:main"

[build-system]
requires = ["hatchling", "editables"]
build-backend = "serial_mcp_build"
backend-path = ["."]

[tool.hatch.build.targets.wheel]
# Python modules retained for the legacy server, daemon and human terminal.
# The default frontend is injected as a native executable; there is no Python
# frontend console shim.
include = ["server.py", "serial_mcp_engine.py", "serial_mcp_ipc.py", "serial_mcp_daemon.py", "serial_mcp_terminal.py"]

[tool.hatch.build.targets.sdist]
include = ["README.md", "AGENTS.md", "server.py", "serial_mcp_engine.py", "serial_mcp_ipc.py", "serial_mcp_daemon.py", "serial_mcp_terminal.py", "serial_mcp_build.py", "docs/**", "rust-client/**", "pyproject.toml", "uv.lock", "flake.nix", "flake.lock"]
exclude = ["serial_mcp_client.py"]
